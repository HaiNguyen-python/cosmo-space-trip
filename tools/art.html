<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Art Maker</title>
<style>
  :root { --bg: #0a0d2c; --fg: #e8ecff; --muted: #9aa3c7; --accent: #ffd84d; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: ui-rounded, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { color: var(--muted); margin: 0 0 18px; max-width: 760px; line-height: 1.45; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  figure { margin: 0; }
  figure canvas { width: 240px; height: 240px; border-radius: 20px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  figcaption { margin-top: 8px; font-size: 14px; color: var(--muted); }
  a { color: var(--accent); font-weight: 700; }
  #status { margin-top: 18px; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<h1>App Art Maker</h1>
<p>Draws the App Store icon (1024 × 1024) and launch screen (2732 × 2732) from the game's own artwork.
Save the files into <code>resources/</code> using the exact names shown. They are plain RGB PNGs with no
transparency, which Apple requires for app icons.</p>
<div class="grid" id="grid"></div>
<div id="status"></div>

<script src="../src/util.js"></script>
<script src="../src/draw.js"></script>
<script src="png.js"></script>
<script>
(function (SA) {

  function spaceBackground(ctx, S, seed) {
    const g = ctx.createRadialGradient(S * 0.5, S * 0.42, S * 0.05, S * 0.5, S * 0.5, S * 0.75);
    g.addColorStop(0, '#3a2a8c');
    g.addColorStop(0.55, '#16124a');
    g.addColorStop(1, '#070920');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const neb = [[0.2, 0.25, 0.45, 'rgba(220,80,170,0.22)'], [0.85, 0.8, 0.5, 'rgba(40,140,230,0.22)']];
    for (const [x, y, r, c] of neb) {
      const n = ctx.createRadialGradient(x * S, y * S, 0, x * S, y * S, r * S);
      n.addColorStop(0, c);
      n.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = n;
      ctx.fillRect(0, 0, S, S);
    }
    const rnd = SA.seeded(seed);
    for (let i = 0; i < 160; i++) {
      const x = rnd() * S, y = rnd() * S, s = (0.6 + rnd() * 1.6) * S / 1024;
      ctx.globalAlpha = 0.4 + rnd() * 0.6;
      ctx.fillStyle = rnd() > 0.8 ? '#ffe9b8' : '#ffffff';
      if (rnd() > 0.88) { SA.starPath(ctx, x, y, s * 4, 0.28, 4, 0); ctx.fill(); }
      else { SA.circle(ctx, x, y, s * 1.3); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function drawIcon(ctx, S) {
    spaceBackground(ctx, S, 9);
    SA.drawBody(ctx, 'saturn', S * 0.78, S * 0.2, S * 0.1, { t: 0, lx: -0.7, ly: 0.3 });
    SA.drawBody(ctx, 'mars', S * 0.16, S * 0.8, S * 0.05, { t: 0, lx: 0.6, ly: -0.5 });
    const glow = ctx.createRadialGradient(S / 2, S * 0.56, S * 0.1, S / 2, S * 0.56, S * 0.45);
    glow.addColorStop(0, 'rgba(120,255,210,0.35)');
    glow.addColorStop(1, 'rgba(120,255,210,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, S, S);
    // Cosmo, big and friendly. Body is ~84 units wide at scale 1.
    SA.drawCosmo(ctx, S * 0.5, S * 0.6, S / 1024 * 6.2, { t: 1, noBob: true, look: [0.3, -0.2] });
  }

  function drawSplash(ctx, S) {
    ctx.fillStyle = '#0a0d2c';
    ctx.fillRect(0, 0, S, S);
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.4);
    g.addColorStop(0, 'rgba(90,60,190,0.45)');
    g.addColorStop(1, 'rgba(90,60,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const rnd = SA.seeded(5);
    for (let i = 0; i < 380; i++) {
      ctx.globalAlpha = 0.3 + rnd() * 0.7;
      ctx.fillStyle = '#fff';
      SA.circle(ctx, rnd() * S, rnd() * S, 1 + rnd() * 2.6);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Keep the art in the middle: the launch screen is cropped to each device's shape.
    SA.drawCosmo(ctx, S / 2, S * 0.52, 5.5, { t: 1, noBob: true, wave: false });
  }

  const ART = [
    { file: 'icon-only.png', size: 1024, draw: drawIcon, label: 'App icon' },
    { file: 'splash.png', size: 2732, draw: drawSplash, label: 'Launch screen' },
    { file: 'splash-dark.png', size: 2732, draw: drawSplash, label: 'Launch screen (dark mode)' },
  ];

  // Optional: ?save=http://127.0.0.1:PORT sends the files to a local helper that writes them to disk.
  const saveTo = new URLSearchParams(location.search).get('save');
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');

  (async () => {
    for (const a of ART) {
      const c = document.createElement('canvas');
      c.width = c.height = a.size;
      a.draw(c.getContext('2d'), a.size);
      const blob = await window.encodeRGBPNG(c);
      const fig = document.createElement('figure');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = a.file;
      link.textContent = 'Download ' + a.file;
      fig.appendChild(c);
      const cap = document.createElement('figcaption');
      cap.append(a.label + ' · ' + a.size + '×' + a.size + ' · ');
      cap.appendChild(link);
      fig.appendChild(cap);
      grid.appendChild(fig);
      if (saveTo) {
        const r = await fetch(saveTo + '/' + a.file, { method: 'POST', body: blob });
        status.textContent += a.file + ': ' + (r.ok ? 'saved' : 'failed') + '  ';
      }
    }
    if (!saveTo) status.textContent = 'Ready. Click each link to download.';
    window.artDone = true;
  })();
})(window.SA);
</script>
</body>
</html>
